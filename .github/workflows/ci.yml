name: HP-HL CI v0.94

# 3-OS build matrix: ubuntu-latest, windows-latest, macos-latest
# Compila + roda 100% dos testes em cada OS.

on:
  push:
    branches: [master, m-sprint3-v092, m-sprint4-v093, m-sprint5-v094]
  pull_request:
    branches: [master]

env:
  HPHL_VERSION: v0.94.0
  HPHL_RUNTIME_ABI: 100

jobs:
  test:
    name: ${{ matrix.os }} (gcc-${{ matrix.gcc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        gcc: [13]
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSYS2 (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ucrt64
        install: >-
          git
          base-devel
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-llvm
          mingw-w64-ucrt-x86_64-make
          mingw-w64-ucrt-x86_64-tools

    - name: Setup dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ gcc make llvm-22-dev

    - name: Setup dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install llvm@22
        brew link --force llvm@22

    - name: Build (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $env:Path = "/ucrt64/bin;$env:Path"
        powershell -ExecutionPolicy Bypass -File tools/build.ps1

    - name: Build (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        chmod +x tools/build.sh
        bash tools/build.sh
        # Ensure binary is at expected path for test steps
        mkdir -p compiler/bin
        cp -f compiler/bin/hphlc compiler/hphlc 2>/dev/null || true

    - name: Run tests (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $env:Path = "/ucrt64/bin;$env:Path"
        powershell -ExecutionPolicy Bypass -File tools/test.ps1 -Suite all

    - name: Run tests (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        cd compiler
        ./hphlc ../tests/positive/hello.hphl -o /tmp/hello 2>&1 | tail -1
        /tmp/hello | head -10

    - name: Verify ABI check
      if: matrix.os != 'windows-latest'
      run: |
        cd compiler
        ./hphlc -e "void Main() { print(\"abi-test\n\"); }" 2>&1 || \
        echo "ok (skipping -e inline test)"

  # Testa exemplos do Sprint 4 e 5 em cada OS
  examples:
    name: examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup MSYS2 (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ucrt64
        install: git, base-devel, mingw-w64-ucrt-x86_64-gcc, mingw-w64-ucrt-x86_64-llvm
    - name: Build examples
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $env:Path = "/ucrt64/bin;$env:Path"
        Set-Location compiler
        foreach ($ex in @("examples/cookbook/01_fizzbuzz.hphl",
                          "examples/gc/gc_stress.hphl",
                          "examples/crypto/ed25519_stress.hphl")) {
          $exe = $ex -replace '\.hphl$','.exe'
          ./hphlc.exe $ex -o $exe 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "FAIL: $ex"; exit 1 }
        }
        Write-Host "All examples build OK on Windows"
    - name: Build examples (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        cd compiler
        for ex in examples/cookbook/01_fizzbuzz.hphl \
                  examples/gc/gc_stress.hphl \
                  examples/crypto/ed25519_stress.hphl; do
          ./hphlc "$ex" -o "/tmp/$(basename $ex .hphl)" || exit 1
        done
        echo "All examples build OK on Unix"
